# Tiny end-to-end smoke test (runs in about a minute on a laptop CPU).
name: e0_smoke
data:
  train: {gen: {topology: er, n: 40, size_mode: fixed_degree, mean_degree: 16}, n_graphs: 300, seed: 1}
  val:   {gen: {topology: er, n: 40, size_mode: fixed_degree, mean_degree: 16}, n_graphs: 100, seed: 2}
  test:
    fd_n40: {gen: {topology: er, n: 40, size_mode: fixed_degree, mean_degree: 16}, n_graphs: 100, seed: 3}
    fd_n80: {gen: {topology: er, n: 80, size_mode: fixed_degree, mean_degree: 16}, n_graphs: 100, seed: 4}
models: [kstep1, kstep3, linreg_A, linreg_B, mlp_B, gbt_B, g1_paper, g2_en]
model_overrides:
  g2_en: {eval_T: [16, 32]}
seeds: [0]
train: {epochs: 5, batch_size: 32, lr: 0.003, patience: 5}
