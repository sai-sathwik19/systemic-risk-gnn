# E2 - size generalisation on Erdos-Renyi networks.
# Train on the paper's ER setting (N = 100, p = 0.4, unit liabilities, assets 10*Beta(2,5)) and test, without
# retraining, on other sizes:
#   fd_nX : fixed_degree mode - expected degree kept at 39.6, so local neighbourhoods look the same
#           (clean size shift; main result)
#   fp_nX : fixed_p mode (mid-report design) - p stays 0.4, so degree, leverage and stress grow with N
#           (size + density + stress shift; shown as a contrast)
name: e2_size_er
data:
  train: {gen: {topology: er, n: 100}, n_graphs: 10000, seed: 401}
  val:   {gen: {topology: er, n: 100}, n_graphs: 2500,  seed: 402}
  test:
    fd_n100:  {gen: {topology: er, n: 100}, n_graphs: 1000, seed: 403}
    fd_n50:   {gen: {topology: er, n: 50,   size_mode: fixed_degree}, n_graphs: 1000, seed: 404}
    fd_n200:  {gen: {topology: er, n: 200,  size_mode: fixed_degree}, n_graphs: 1000, seed: 405}
    fd_n500:  {gen: {topology: er, n: 500,  size_mode: fixed_degree}, n_graphs: 1000, seed: 406}
    fd_n1000: {gen: {topology: er, n: 1000, size_mode: fixed_degree}, n_graphs: 500,  seed: 407}
    fp_n50:   {gen: {topology: er, n: 50,   size_mode: fixed_p}, n_graphs: 1000, seed: 408}
    fp_n200:  {gen: {topology: er, n: 200,  size_mode: fixed_p}, n_graphs: 1000, seed: 409}
models: [kstep1, kstep3, linreg_A, linreg_B, mlp_B, gbt_B, g1_paper, g2_en]
model_overrides:
  g2_en: {eval_T: [16, 32, 64]}
seeds: [0, 1, 2]
train: {epochs: 200, batch_size: 64, lr: 0.001, patience: 20}
